name: Publish Proxy Package

on:
  push:
    tags:
      - 'proxy-*'  # Triggers on tags like proxy-1.0.0, proxy-1.0.1, etc.

jobs:
  publish:
    runs-on: ubuntu-latest
    container: node:24
    permissions:
      id-token: write  # Required for OIDC trusted publishing
      contents: read

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgboss
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install root dependencies
        run: npm install

      - name: Install proxy dependencies
        working-directory: packages/proxy
        run: npm install

      - name: Publish to npm
        working-directory: packages/proxy
        run: npm publish --provenance --access public
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/pgboss
