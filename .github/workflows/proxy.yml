on:
  push:
    branches: [master]
    tags-ignore: ['**']
    paths:
      - 'packages/proxy/**'
      - 'src/**'
      - '.github/workflows/proxy.yml'
  pull_request:
    branches: [master]
    paths:
      - 'packages/proxy/**'
      - 'src/**'
      - '.github/workflows/proxy.yml'

name: Proxy CI

jobs:
  test:
    runs-on: ubuntu-latest
    container: node:24
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24

    - name: Install root dependencies
      run: npm install

    - name: Install proxy dependencies
      run: npm install
      working-directory: packages/proxy

    - name: Typecheck
      run: npm run typecheck
      working-directory: packages/proxy

    - name: Run tests
      run: npm test
      working-directory: packages/proxy
